# SPDX-License-Identifier: Apache-2.0
name: web
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: "26.13.0"
      - name: emsdk 7.0.0
        run: bash scripts/build_wasm.sh
      - name: npm test and build
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          npx vitest run
          npm run build
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-dist
          path: web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: demo-screenshot
          path: web/test-results/demo.png
